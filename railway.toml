# Railway deployment config for the AccessAudit scanner service.
# This file is at the repo root so Railway can find it.
# The Next.js app is deployed separately on Vercel.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "npx tsx worker/server.ts"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
